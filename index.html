<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #0d1117; color: #e6edf3; min-height: 100vh;
         display: flex; justify-content: center; padding: 64px 20px; }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 28px; margin-bottom: 8px; }
  p.sub { color: #8b949e; margin-bottom: 32px; }
  a.card { display: block; text-decoration: none; color: inherit;
           border: 1px solid #30363d; border-radius: 12px; padding: 20px 22px;
           margin-bottom: 16px; transition: border-color .2s, transform .2s; }
  a.card:hover { border-color: #58a6ff; transform: translateY(-2px); }
  .card h2 { font-size: 20px; margin-bottom: 8px; }
  .card p { color: #8b949e; font-size: 14px; line-height: 1.6; }
  .card .meta { margin-top: 10px; font-size: 12px; color: #6e7681; }
</style>
</head>
<body>
<main>
  <h1>文章</h1>
  <p class="sub">技术讲解合集</p>
  <a class="card" href="dflash2/">
    <h2>DFlash2 讲解</h2>
    <p>一次 forward，猜完一整个 token block —— speculative decoding 的瓶颈、块并行 drafting、候选选择器、两 tap 动态深度卷积，以及目标模型验证与回滚。</p>
    <div class="meta">DFlash2 · 推测解码</div>
  </a>
</main>
</body>
</html>
